[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "research-kb-core"
version = "0.1.1.dev2026080603"
description = "Cross-platform contracts and deterministic CLI primitives for local-first research knowledge bases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["research", "knowledge-base", "provenance", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "filelock>=3.16,<4",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
pdf = [
  "pdfplumber==0.11.10",
]
test = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "reportlab>=4.2,<6",
]

[project.scripts]
research-kb = "research_kb.cli:main"

[project.urls]
Homepage = "https://github.com/ZhangChengwei0722/Scientific-Research-Knowledge-Base"
Repository = "https://github.com/ZhangChengwei0722/Scientific-Research-Knowledge-Base"
Issues = "https://github.com/ZhangChengwei0722/Scientific-Research-Knowledge-Base/issues"
Security = "https://github.com/ZhangChengwei0722/Scientific-Research-Knowledge-Base/security/policy"
Changelog = "https://github.com/ZhangChengwei0722/Scientific-Research-Knowledge-Base/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/research_kb"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "research_kb/_data/schemas"
"templates" = "research_kb/_data/templates"

[tool.hatch.build]
exclude = [
  "tests/fixtures/invalid/privacy_cases.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: structural unit-test class",
  "contract: structural public-contract test class",
  "integration: structural cross-service integration test class",
  "privacy: structural repository privacy test class",
  "benchmark: structural benchmark test class",
  "slow: measured long-running test or file",
  "scale: scale or benchmark validation outside normal feature feedback",
  "serial: test that must remain in a single-process shard",
  "windows: required Windows-specific behavior",
  "agent_route: document-route agent application scenarios",
  "agent_primary: primary-semantic agent application scenarios",
  "agent_review: review-semantic agent application scenarios",
  "reading_source: evidence source preparation and handle scenarios",
  "reading_projection: paper, evidence, review, and comparison projection scenarios",
]
